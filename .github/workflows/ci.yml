name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Server protocol tests
        run: npm run test:server

      # Same suite against the Cloudflare Worker under wrangler dev
      # (local wrangler dev stalls intermittently on Windows).
      - name: Server protocol tests (Cloudflare Worker)
        if: runner.os != 'Windows'
        env:
          SYNC_SERVER: worker
        run: npm run test:server

  extension:
    name: Build extension
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build .xpi
        run: npm run build:xpi

      - uses: actions/upload-artifact@v7
        with:
          name: twilight-sync-xpi
          path: dist/*.xpi
          retention-days: 90
